name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  syntax-and-imports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio
      - name: Syntax check
        run: python -m compileall -q -f .
      - name: Import smoke
        run: python scripts/import_smoke.py
      - name: Unit tests
        run: pytest tests/ -v --tb=short

  production-readiness:
    runs-on: ubuntu-latest
    needs: syntax-and-imports
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Readiness checklist
        run: python scripts/prod_check.py
